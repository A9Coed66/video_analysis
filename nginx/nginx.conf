# =============================================================================
# Nginx Reverse Proxy — Voice Separator Web (Production)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # -----------------------------------------------------------------------
    # CORS origin map
    # -----------------------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "https://example.com"             $http_origin;
    }

    # -----------------------------------------------------------------------
    # Upstream — API server
    # -----------------------------------------------------------------------
    upstream api_backend {
        server api:8000;
    }

    # -----------------------------------------------------------------------
    # HTTP server
    # -----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Serve static files or proxy to API (no TLS redirect for now)
            try_files $uri $uri/ @backend;
        }

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # /api/pipeline — extended timeout
        location /api/pipeline {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, X-API-Key, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Key         "${INTERNAL_API_KEY}";

            proxy_connect_timeout 60s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            send_timeout          600s;

            client_max_body_size 500m;
        }

        # /api/* — proxy to API server
        location /api/ {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, X-API-Key, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Key         "${INTERNAL_API_KEY}";

            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            client_max_body_size 500m;
        }

        location @backend {
            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server (uncomment when SSL certs are available)
    # -----------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     # ... (copy location blocks from HTTP server above)
    # }
}
