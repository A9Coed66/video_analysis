# =============================================================================
# Nginx Reverse Proxy — Voice Separator Web (Production)
# =============================================================================
# - TLS termination (HTTPS 443 → HTTP internal)
# - Static file serving from volume
# - Proxy /api/* and /health* to API server
# - CORS headers per ALLOWED_ORIGINS
# - Gzip compression for static files and JSON
# - Upload size limit (configurable via env)
# - Extended timeout for /api/pipeline
# =============================================================================

# ---------------------------------------------------------------------------
# CORS origin map — add allowed origins here.
# In production, replace with actual domains from ALLOWED_ORIGINS env var.
# Use envsubst or a startup script to template this from $ALLOWED_ORIGINS.
# ---------------------------------------------------------------------------
map $http_origin $cors_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
    "https://example.com"             $http_origin;
}

# ---------------------------------------------------------------------------
# Upstream — API server (Docker service name)
# ---------------------------------------------------------------------------
upstream api_backend {
    server api:8000;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health check accessible over HTTP (for Docker healthcheck / LB probes)
    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server — main entry point
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # -----------------------------------------------------------------
    # TLS configuration
    # -----------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # -----------------------------------------------------------------
    # Upload size limit — matches MAX_FILE_SIZE (default 500 MB)
    # -----------------------------------------------------------------
    client_max_body_size 500m;

    # -----------------------------------------------------------------
    # Gzip compression — static files and JSON responses
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -----------------------------------------------------------------
    # Static files — served directly from volume
    # -----------------------------------------------------------------
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------
    # /api/pipeline — extended timeout (600s) for long-running ML jobs
    # -----------------------------------------------------------------
    location /api/pipeline {
        # CORS headers
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, X-API-Key, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://api_backend;

        # Proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for pipeline processing
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
    }

    # -----------------------------------------------------------------
    # /api/* — proxy to API server (default timeouts)
    # -----------------------------------------------------------------
    location /api/ {
        # CORS headers
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, X-API-Key, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://api_backend;

        # Proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # -----------------------------------------------------------------
    # /health* — proxy to API server health endpoints
    # -----------------------------------------------------------------
    location /health {
        proxy_pass http://api_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------
    # Default — try static files, then proxy to API
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://api_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
